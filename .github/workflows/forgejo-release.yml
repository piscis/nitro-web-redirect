name: Forgejo release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create Forgejo release 📦
    if: github.server_url != 'https://github.com'
    timeout-minutes: 3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
      - name: Extract release notes from CHANGELOG.md
        shell: bash
        run: node scripts/release-notes.ts "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - name: Create release
        shell: bash
        env:
          TOKEN: ${{ github.token }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases
        run: |
          jq -n --arg tag "$GITHUB_REF_NAME" --rawfile body "$RUNNER_TEMP/notes.md" \
            '{tag_name: $tag, name: $tag, body: $body, draft: false, prerelease: false}' \
            | curl -sS --fail-with-body -X POST "$API" \
              -H "Authorization: token $TOKEN" \
              -H 'Content-Type: application/json' \
              --data @-
