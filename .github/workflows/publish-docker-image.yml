name: Publish Docker image

on:
  push:
    tags:
      - 'v*'

jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
      - name: Test & Lint & Build App
        shell: bash
        run: |
          pnpm i
          pnpm test
          pnpm lint
          pnpm build

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_DEPLOY_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: piscis/nitro-web-redirect
          # The defaults (schedule, branch, tag, pr) plus the bare version:
          # a vX.Y.Z tag pushes :X.Y.Z, :vX.Y.Z and :latest.
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=semver,pattern={{version}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Each platform is loaded and smoke-tested on its own before anything is
      # pushed; the push below runs on the same builder and reuses their cache.
      - name: Build linux/amd64 image for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: nitro-web-redirect:smoke-test-amd64

      - name: Smoke test the linux/amd64 image
        shell: bash
        env:
          DOCKER_DEFAULT_PLATFORM: linux/amd64
        run: scripts/smoke-test.sh nitro-web-redirect:smoke-test-amd64

      - name: Build linux/arm64 image for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          load: true
          push: false
          tags: nitro-web-redirect:smoke-test-arm64

      - name: Smoke test the linux/arm64 image
        shell: bash
        env:
          DOCKER_DEFAULT_PLATFORM: linux/arm64
        run: scripts/smoke-test.sh nitro-web-redirect:smoke-test-arm64

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
